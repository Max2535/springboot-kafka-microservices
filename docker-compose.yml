version: '3.8'

services:
  # Cluster 1: Zookeeper และ Kafka
  zookeeper-cluster1:
    image: bitnami/zookeeper:latest
    container_name: zookeeper-cluster1
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - kafka-network

  kafka-cluster1-broker1:
    image: bitnami/kafka:latest
    container_name: kafka-cluster1-broker1
    depends_on:
      - zookeeper-cluster1
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper-cluster1:2181
      - KAFKA_LISTENERS=PLAINTEXT://kafka-cluster1-broker1:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://192.168.1.200:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - kafka-network

  # Cluster 2: Zookeeper และ Kafka
  zookeeper-cluster2:
    image: bitnami/zookeeper:latest
    container_name: zookeeper-cluster2
    ports:
      - "2182:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - kafka-network

  # Kafka Broker for Cluster 2
  kafka-cluster2-broker1:
    image: bitnami/kafka:latest
    container_name: kafka-cluster2-broker1
    depends_on:
      - zookeeper-cluster2
    ports:
      - "9093:9092"
    environment:
      - KAFKA_BROKER_ID=2
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper-cluster2:2181
      - KAFKA_LISTENERS=PLAINTEXT://kafka-cluster2-broker1:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://192.168.1.200:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks:
      - kafka-network

  # Kafka UI for Monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=cluster1
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-cluster1-broker1:9092
      - KAFKA_CLUSTERS_1_NAME=cluster2
      - KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS=kafka-cluster2-broker1:9092
    depends_on:
      - kafka-cluster1-broker1
      - kafka-cluster2-broker1
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge
